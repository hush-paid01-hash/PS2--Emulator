name: iOS app build
on:
  push:
    branches: [engine-foundation]
    paths:
      - "ios/**"
      - ".github/workflows/ios-shell.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-shell.yml"
  workflow_dispatch:
jobs:
  ios-simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build iOS Simulator app
        run: xcodebuild -project ios/RetroShelfApp.xcodeproj -scheme RetroShelfApp -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
