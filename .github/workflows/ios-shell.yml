name: iOS shell validation
on:
  push:
    branches: [engine-foundation]
    paths:
      - "ios/**"
      - ".github/workflows/ios-shell.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-shell.yml"
jobs:
  swift-validation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Swift syntax
        run: swiftc -parse ios/RetroShelfApp/RetroShelfApp.swift
