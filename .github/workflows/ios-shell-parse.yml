name: Native iOS shell syntax check

on:
  pull_request:
    paths:
      - "project.yml"
      - "ios/OriginalPS2/**"
      - ".github/workflows/ios-shell-parse.yml"
  push:
    branches: [main]
    paths:
      - "project.yml"
      - "ios/OriginalPS2/**"
      - ".github/workflows/ios-shell-parse.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-source-parse:
    name: Parse SwiftUI source (syntax only)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Swift compiler
        run: swift --version

      - name: Parse native frontend source
        run: swiftc -parse ios/OriginalPS2/OriginalPS2App.swift ios/OriginalPS2/ContentView.swift ios/OriginalPS2/EngineBridge.swift

# This check only parses Swift syntax. It does not compile or link the iOS app.
